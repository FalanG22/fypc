name: fypc
services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-b1618Awj}
      POSTGRES_DB: fypc
    volumes:
      - /var/lib/docker/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - erp-net

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-b1618Awj}
      DB_NAME: fypc
    restart: unless-stopped
    networks:
      - erp-net
      - proxy-net

networks:
  erp-net:
  proxy-net:
    external: true
