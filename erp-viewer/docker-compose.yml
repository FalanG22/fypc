version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-b1618Awj}
      POSTGRES_DB: fypc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - erp-net

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-b1618Awj}
      DB_NAME: fypc
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - erp-net

volumes:
  pgdata:

networks:
  erp-net:
