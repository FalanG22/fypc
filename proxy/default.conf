upstream sendasoft {
    server sendasoft_web:80;
}

upstream erp {
    server erp-viewer_app:3000;
}

server {
    listen 80;
    server_name ${SENDASOFT_DOMAIN};

    location / {
        proxy_pass http://sendasoft;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ${FYPC_DOMAIN};

    location / {
        proxy_pass http://erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
